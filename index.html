    <style>
      /* critical: the loader paints before any JS (it is also the first contentful paint) */
      body{margin:0;background:#071f26}
      .loader{--r:0px;position:fixed;inset:0;z-index:100;display:grid;place-content:center;justify-items:center;gap:28px;background:#071f26;color:#f6f2ea;-webkit-mask:radial-gradient(circle at 50% 50%,transparent var(--r),#000 calc(var(--r) + 1px));mask:radial-gradient(circle at 50% 50%,transparent var(--r),#000 calc(var(--r) + 1px))}
      .loader__mark{width:84px;height:84px;color:#e08a5f;will-change:transform;animation:mark-pulse 2.4s ease-in-out 1.6s infinite}
      .loader__svg{display:block;width:100%;height:100%}
      .loader__svg path{stroke-dasharray:1;stroke-dashoffset:1;animation:mark-draw 1.4s cubic-bezier(.22,1,.36,1) forwards}
      .loader__svg path:nth-child(2){animation-delay:.25s}.loader__svg path:nth-child(3){animation-delay:.35s}
      .loader__svg path:nth-child(4){animation-delay:.6s}.loader__svg path:nth-child(5){animation-delay:.5s}.loader__svg path:nth-child(6){animation-delay:.65s}
      .loader__track{width:120px;height:1px;background:rgba(244,250,250,.14);overflow:hidden}
      .loader__bar{height:100%;background:#e08a5f;transform:scaleX(0);transform-origin:left;transition:transform .25s linear}
      @keyframes mark-draw{to{stroke-dashoffset:0}}
      @keyframes mark-pulse{50%{opacity:.6}}
      @media (prefers-reduced-motion:reduce){.loader__svg path{animation:none;stroke-dashoffset:0}.loader__mark{animation:none}}
    </style>
