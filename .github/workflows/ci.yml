name: ci
on:
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/smoke.spec.ts
      - name: weight + a11y (when present)
        run: |
          for t in weight a11y; do if [ -f tests/$t.spec.ts ]; then npx playwright test tests/$t.spec.ts; fi; done
      - name: scroll perf (report only; runners have no GPU)
        run: if [ -f tests/scroll-perf.spec.ts ]; then npx playwright test tests/scroll-perf.spec.ts || true; fi
      - run: npx lhci autorun
      - name: Lighthouse summary (LCP per run)
        if: always()
        run: |
          node -e "const fs=require('fs');const d='.lighthouseci';if(!fs.existsSync(d))process.exit(0);for(const f of fs.readdirSync(d).filter(f=>/^lhr-.*\.json$/.test(f))){const r=JSON.parse(fs.readFileSync(d+'/'+f));if(!r.audits)continue;console.log('LCP',Math.round(r.audits['largest-contentful-paint'].numericValue),'ms perf',r.categories.performance.score,'a11y',r.categories.accessibility.score,'CLS',r.audits['cumulative-layout-shift'].numericValue.toFixed(3))}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            .lighthouseci
            perf-report.json
          if-no-files-found: ignore
          include-hidden-files: true
