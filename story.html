    <meta property="og:title" content="Our story: from sea and pond to port | Skylark Exim" />
    <meta property="og:description" content="Two stories, scroll by scroll: wild catch from the fishing vessels and farmed shrimp from partner farms, through the plant at Anandapuram, Visakhapatnam, to the port." />
    <meta property="og:url" content="https://skylarkexim.com/story" />

    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://skylarkexim.com/story" />
    <link rel="preload" href="/fonts/instrument-serif-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-tight-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-serif-latin-400-italic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-tight-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin />
    <!-- hero loop poster (#197, #hd): AVIF preloads matching the hero <picture> (scripts/static-hero.ts) -->
    <!--hero-preload-->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- intro variant before first paint (#218): seen this session → no loader; #ocean / #pond → the short intro -->
    <script>try{var c=document.documentElement.classList;if(sessionStorage.getItem('skylark-intro'))c.add('intro-skip');else if(/^#(ocean|pond)$/.test(location.hash))c.add('intro-short')}catch(e){}</script>
    <style>
      /* critical: the loader and the hero copy paint before any JS. The mark sits in the header band above the copy (#219: it
         clears the copy on short laptops too), and the copy stays on top of the loader (#207): Chrome ignores occluded text for LCP, so hidden copy would wait for the reveal. */
      body{margin:0;background:#071f26}
      .loader{--r:0px;--k:1;position:fixed;inset:0;z-index:100;display:grid;grid-auto-flow:column;justify-content:center;align-content:start;align-items:center;padding-top:12px;gap:12px;background:#071f26;color:#f6f2ea;-webkit-mask:radial-gradient(circle at 50% 50%,transparent var(--r),#000 calc(var(--r) + 1px));mask:radial-gradient(circle at 50% 50%,transparent var(--r),#000 calc(var(--r) + 1px));animation:loader-out .4s ease 3s forwards}
      /* intro (#218): the mark draws in (done by 1.15 s), the name fades in beside it, and under the name a wave line draws and fills with the real load progress; --k shortens it on deep links */
      .intro-short .loader{--k:.6}
      .intro-skip .loader{display:none}
      .loader__mark{width:44px;height:44px;color:#e08a5f;will-change:transform;animation:mark-pulse 2.4s ease-in-out calc(1.2s * var(--k)) infinite}
      .loader__svg{display:block;width:100%;height:100%}
      .loader__svg path{stroke-dasharray:1;stroke-dashoffset:1;animation:mark-draw calc(.8s * var(--k)) cubic-bezier(.22,1,.36,1) forwards}
      .loader__svg path:nth-child(2){animation-delay:calc(.1s * var(--k))}.loader__svg path:nth-child(3){animation-delay:calc(.15s * var(--k))}
      .loader__svg path:nth-child(4){animation-delay:calc(.35s * var(--k))}.loader__svg path:nth-child(5){animation-delay:calc(.25s * var(--k))}.loader__svg path:nth-child(6){animation-delay:calc(.3s * var(--k))}
      .loader__side{display:grid;gap:7px;justify-items:start}
      .loader__track{display:block;width:120px;height:8px;overflow:visible;animation:wave-breathe 2.6s ease-in-out calc(1.1s * var(--k)) infinite}
      .loader__track path{stroke-dasharray:1;stroke-dashoffset:1}
      .loader__wave{color:rgba(244,250,250,.3);animation:mark-draw calc(.6s * var(--k)) ease-out calc(.45s * var(--k)) forwards}
      .loader__name{margin:0;font:500 .8125rem/1.25 "Inter Tight",sans-serif;letter-spacing:.08em;color:rgba(246,242,234,.82);animation:name-in calc(.45s * var(--k)) ease-out calc(.65s * var(--k)) backwards}
      .loader__bar{color:#e08a5f;transition:stroke-dashoffset .25s linear}
      @keyframes mark-draw{to{stroke-dashoffset:0}}
      @keyframes mark-pulse{50%{opacity:.6}}
      @keyframes wave-breathe{50%{transform:scaleY(.55)}}
      @keyframes name-in{from{opacity:0}}
      /* failsafe: if the script hasn't taken over by 3 s, the loader fades out on its own (Loader.tsx cancels this) */
      @keyframes loader-out{to{opacity:0;visibility:hidden}}
      @media (prefers-reduced-motion:reduce){.loader__svg path,.loader__wave{animation:none;stroke-dashoffset:0}.loader__mark,.loader__track,.loader__name{animation:none}}
      /*static-hero-css*/
    </style>
    <title>Our story: from sea and pond to port | Skylark Exim</title>
  </head>
  <body>
    <div id="root"></div>
    <!--static-hero-->
    <div id="boot" class="loader" role="progressbar" aria-label="Loading Skylark Exim" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="loader__mark"><svg class="loader__svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path pathLength="1" d="M13 40C12 27 20 16 33 12C27 19 24 27 24 37"/><path pathLength="1" d="M13 40L8 45M13 40l6 3.5"/><path pathLength="1" d="M42 11C53 13 59 23 55 33C52 40 44 42 39 37C36 34 38 30 41 31"/><path pathLength="1" d="M42 11C38 8 33 7 28 8M44 17l4-3M47 23l5-2M48 29l5 0"/><path pathLength="1" d="M6 49Q14 44 22 49T38 49T54 48T60 47"/><path pathLength="1" d="M12 56Q20 52 28 56T44 56T56 55"/></svg></div>
      <div class="loader__side">
        <p class="loader__name" aria-hidden="true">Skylark Exim · Visakhapatnam</p>
        <svg class="loader__track" viewBox="0 0 120 8" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" aria-hidden="true"><path class="loader__wave" pathLength="1" d="M0 4Q7.5 0 15 4T30 4T45 4T60 4T75 4T90 4T105 4T120 4"/><path class="loader__bar" pathLength="1" d="M0 4Q7.5 0 15 4T30 4T45 4T60 4T75 4T90 4T105 4T120 4"/></svg>
      </div>
    </div>
    <script type="module" src="/src/story-main.tsx"></script>
  </body>
</html>
