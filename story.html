<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#071f26" />
    <meta name="description" content="Two stories, scroll by scroll: wild catch from the fishing vessels and farmed shrimp from partner farms, through the plant at Anandapuram, Visakhapatnam, to the port." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Skylark Exim" />
    <meta property="og:title" content="Our story: from sea and pond to port | Skylark Exim" />
    <meta property="og:description" content="Two stories, scroll by scroll: wild catch from the fishing vessels and farmed shrimp from partner farms, through the plant at Anandapuram, Visakhapatnam, to the port." />
    <meta property="og:url" content="https://skylarkexim.com/story" />
    <meta property="og:image" content="https://skylarkexim.com/media/hero-loop_1280.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://skylarkexim.com/story" />
    <link rel="preload" href="/fonts/instrument-serif-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-tight-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-serif-latin-400-italic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-tight-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin />
    <!-- hero loop poster (#197, #hd): AVIF preloads matching the hero <picture> (scripts/static-hero.ts) -->
    <!--hero-preload-->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- intro variant before first paint (#218): #ocean / #pond → the short intro. /story always shows it: it holds until the path is in memory (#preload), which on a return visit is the HTTP cache's few hundred ms -->
    <script>try{if(/^#(ocean|pond)$/.test(location.hash))document.documentElement.classList.add('intro-short')}catch(e){}</script>
    <style>
      /* critical: the loader and the hero copy paint before any JS. The mark sits in the header band above the copy (#219: it
         clears the copy on short laptops too), and the copy stays on top of the loader (#207): Chrome ignores occluded text for LCP, so hidden copy would wait for the reveal. */
      body{margin:0;background:#071f26}
      .loader{--r:0px;position:fixed;inset:0;z-index:100;display:grid;justify-content:center;align-content:start;padding-top:14px;background:#071f26;color:#f6f2ea;animation:loader-thin .7s ease-out forwards,loader-out .2s ease 3s forwards;-webkit-mask:radial-gradient(circle at 50% 50%,transparent var(--r),#000 calc(var(--r) + 1px));mask:radial-gradient(circle at 50% 50%,transparent var(--r),#000 calc(var(--r) + 1px))}
      /* intro (#270): about 1 s in all. The wordmark is plain text in the header band (the static hero copy keeps the middle, #207); a hairline fills along the bottom edge in 0.6 s while the first hero frame shows through the thinning overlay; Loader.tsx opens the wipe at 0.7 s, so it is gone by 1.0 s. It claims no load progress and gates nothing. */
      .intro-skip .loader{display:none}
      .loader__name{margin:0;font:400 1.375rem/1.2 "Instrument Serif",serif;letter-spacing:.02em;color:#f6f2ea;animation:name-in .45s cubic-bezier(.22,1,.36,1) backwards}
      .loader__line{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(246,242,234,.12);overflow:hidden}
      .loader__line::after{content:"";display:block;height:100%;background:#e08a5f;transform-origin:left;animation:line-fill .6s cubic-bezier(.65,0,.35,1) .1s backwards}
      /* gated (#preload, Loader.tsx): the hairline and a percentage follow the bytes of the path in memory */
      .loader__pct{position:absolute;right:16px;bottom:10px;font:500 .75rem/1 "Inter Tight",sans-serif;letter-spacing:.08em;font-variant-numeric:tabular-nums;color:rgba(246,242,234,.72)}
      .loader.is-gated .loader__line::after{animation:none;transform:scaleX(var(--p,0));transition:transform .25s ease-out}
      @keyframes name-in{from{opacity:0;transform:translateY(6px)}}
      @keyframes line-fill{from{transform:scaleX(0)}}
      @keyframes loader-thin{from{background-color:#071f26}to{background-color:rgba(7,31,38,.84)}}
      @keyframes loader-out{to{opacity:0;visibility:hidden}}
      @media (prefers-reduced-motion:reduce){.loader{display:none}}
      /*static-hero-css*/
    </style>
    <title>Our story: from sea and pond to port | Skylark Exim</title>
  </head>
  <body>
    <div id="root"></div>
    <!--static-hero-->
    <div id="boot" class="loader" aria-hidden="true">
      <p class="loader__name">Skylark Exim</p>
      <span class="loader__line"></span>
      <span class="loader__pct"></span>
    </div>
    <script type="module" src="/src/story-main.tsx"></script>
  </body>
</html>
